name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published against code that has not changed, so check weekly as well (Monday 06:00 UTC).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (runtime requirements)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # Only what ships in the container image. The test-only requirements join once pytest 9 removes
      # the known pytest 8 advisory, so the job never has to ignore an advisory to stay green.
      - name: Audit backend/requirements.txt
        run: pip-audit --strict --desc -r backend/requirements.txt

  npm:
    name: npm (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reads package-lock.json directly, so no install is needed. Dev tooling is excluded for the same
      # reason as above: it never ships to the browser.
      - name: Audit production dependencies
        run: npm audit --omit=dev
