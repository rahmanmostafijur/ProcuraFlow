name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procuraflow
          POSTGRES_PASSWORD: procuraflow
          POSTGRES_DB: procuraflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procuraflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      # Test-only value; settings accept it because ENVIRONMENT is test.
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://procuraflow:procuraflow@localhost:5432/procuraflow
      TEST_DATABASE_URL: postgresql+asyncpg://procuraflow:procuraflow@localhost:5432/procuraflow_test
      PGPASSWORD: procuraflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Create the test database
        run: psql -h localhost -U procuraflow -d procuraflow -c "CREATE DATABASE procuraflow_test"

      # Static checks (ruff, mypy) run here, before the tests.

      # The service database is empty, so this proves the migration chain builds the schema from scratch.
      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint and format checks run here, before the type check.

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
