services:
  - type: web
    name: procuraflow-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Migrations and the admin bootstrap run from start.sh; Render's free tier has no pre-deploy command.
      - key: SEED_ON_START
        value: "true"
      # Sample suppliers/products for the public demo. Delete this variable for a real deployment,
      # which then only gets roles, permissions and the first admin.
      - key: SEED_DEMO_DATA
        value: "true"
      # Trusted reverse proxies for the client address: Vercel (which sets the client IP) and Render's
      # own proxy (which appends its peer), so the app sees exactly 2 X-Forwarded-For entries. Verify
      # after the first deploy (README, "Post-deployment verification"); a wrong value degrades to
      # per-account throttling only, it never trusts a spoofed address.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # Generated once by Render and kept across deploys.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Paste in the Render dashboard (never commit them): the Neon connection string, and the
      # first admin's credentials (password must be unique and at least 12 characters).
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
